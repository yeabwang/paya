seed: 42
threads: 8
assets:
  spotr: third-party/spotr
  text: third-party/biolord
preparation:
  max_channels: 128
  max_samples: 12800
head:
  width: 256
  layers: 2
  heads: 4
  dropout: 0.1
data:
  train: data/training/train.json
  selection: data/training/selection.json
  calibration: data/training/calibration.json
  test: data/training/test.json
feature_cache: cache/paya-fast/features.sqlite3
feature_cache_format: sqlite
# Confirm this batch size against reports/fast-benchmark.json before launching.
batch_size: 512
optim:
  epochs: 3
  lr: 0.0003
  weight_decay: 0.01
  checkpoint_every_steps: 25
wandb:
  project: paya
  name: paya-full-002
  mode: online
  log_every: 1
  log_models: false
  finish_timeout: 20
