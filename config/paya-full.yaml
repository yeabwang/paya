seed: 42
threads: 4
assets:
  spotr: third-party/spotr
  text: third-party/biolord
preparation:
  max_channels: 128
  max_samples: 12800
head:
  width: 256
  layers: 2
  heads: 4
  dropout: 0.1
data:
  train: data/training/train.json
  selection: data/training/selection.json
  test: data/training/test.json
feature_cache: cache/paya-full/features
batch_size: 16
optim:
  epochs: 3
  lr: 0.0003
  weight_decay: 0.01
  checkpoint_every_steps: 100
wandb:
  project: paya
  name: paya-full-001
  mode: online
  log_every: 10
  log_models: false
  finish_timeout: 120
