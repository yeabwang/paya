[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "paya"
dynamic = ["version"]
description = "Paya: a non-autoregressive decision engine for body signals."
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3", "torch>=2.6", "safetensors>=0.5",
  "transformers>=4.51,<5", "PyYAML>=6",
  "scikit-learn>=1.5", "sentencepiece>=0.2",
  "scipy>=1.13", "sentence-transformers>=3,<6",
  "neurokit2==0.2.12", "einops>=0.8,<1", "huggingface-hub>=0.34,<1",
  "wandb>=0.31,<1",
  "pyarrow>=17,<24",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["paya*", "scripts*"]

[tool.setuptools.dynamic]
version = {attr = "paya.provenance.PACKAGE_VERSION"}

[tool.setuptools.package-data]
"paya.vendor" = ["LICENSE", "SOURCE.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires pinned pretrained encoder assets"]
